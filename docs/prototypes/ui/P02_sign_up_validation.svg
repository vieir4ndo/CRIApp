    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect x="80" y="110" width="920" height="1700" rx="40" fill="#FFFFFF" fill-opacity="0.1"/>
  <text x="140" y="220" font-size="52" font-family="Arial" fill="#FFFFFF" font-weight="700">Create account</text>

  <rect x="140" y="280" width="800" height="108" rx="16" fill="#FFFFFF"/>
